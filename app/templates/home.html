<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPAY Sandbox Demo</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>

<body>

    <div class="container">
        <form action="/payment/create" method="get">
            <div class="form-group">
                <label for="order_info">Order</label>
                <input id="order_info" type="text" name="order_info" value="T-Shirt" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount (VND)</label>
                <input id="amount" type="number" name="amount" value="100000" min="1000" required>
            </div>

            <button type="submit">Pay with VNPAY</button>
        </form>
    </div>
</body>

</html>
